    <!-- Main Workspace -->
    <!-- Accessibility H1 -->
    <h1 class="sr-only">JPG to PNG Converter</h1>
    <main id="main-content" class="container container-xl py-4">
        
        <!-- Breadcrumbs Placeholder -->
        <div id="ph-breadcrumbs"></div>

        <!-- Tool Page Hero Placeholder -->
        <div id="ph-hero"></div>

        <!-- Tool Interface Panel -->
        <section class="tool-container mb-8" id="tool-interface" style="position:relative;">
            <div class="tool-interface-card card-glass">

                <div class="tool-split-view mb-3">
                    <div class="flex flex-col gap-2">
                        <div class="editor-panel-title"><span>JPEG Upload</span></div>
                        <div id="file-dropzone" class="dropzone">
                            <svg class="icon icon-xl text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <div><span class="weight-bold text-gradient">Click to upload</span> or drag &amp; drop<p class="text-xs text-muted mt-05">JPEG / JPG files only</p></div>
                            <input type="file" id="file-input" class="file-input-hidden" accept="image/jpeg,image/jpg,.jpg,.jpeg">
                        </div>
                        <div id="file-preview-wrap" style="display:none;">
                            <img id="file-preview" style="max-width:100%;max-height:160px;border-radius:var(--radius-sm);border:1px solid var(--border-color);" alt="Preview">
                        </div>
                    </div>
                    <div class="flex flex-col gap-15">
                        <div class="editor-panel-title"><span>Conversion Info</span></div>
                        <div id="conv-placeholder" class="flex flex-col items-center justify-center text-center text-muted" style="flex:1;border:1px dashed var(--border-color);border-radius:var(--radius-md);padding:var(--spacing-3);">
                            <svg class="icon icon-xl mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                            <p class="text-sm">Upload a JPEG file to convert it to PNG.</p>
                        </div>
                        <div id="conv-results" style="display:none;" class="flex flex-col gap-1">
                            <div class="card" style="padding:var(--spacing-2);"><div class="text-xs text-muted">Filename</div><div id="out-filename" class="weight-bold"></div></div>
                            <div class="card" style="padding:var(--spacing-2);"><div class="text-xs text-muted">Dimensions</div><div id="out-dims" class="weight-bold"></div></div>
                            <div class="card" style="padding:var(--spacing-2);"><div class="text-xs text-muted">Original Size</div><div id="orig-size" class="weight-bold"></div></div>
                        </div>
                    </div>
                </div>
                <div class="actions-bar">
                    <button class="btn btn-ghost" id="tool-reset">Reset</button>
                    <button class="btn btn-primary" id="btn-download-png" disabled style="opacity:0.5;">Download PNG</button>
                </div>
            </div>
        </section>
        <div id="ph-seo"></div>
        <div id="ph-related"></div>
